<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Library API — Читатели</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<nav>
    <a class="brand" href="/">📚 Library Management System</a>
    <div class="links">
        <a href="/">📊 Аналитика</a>
        <a href="/books">📖 Книги</a>
        <a href="/readers" class="active">👥 Читатели</a>
        <a href="/loans">🔄 Выдача и возврат</a>
    </div>
</nav>

<div class="container">
    <div id="msg"></div>
    <div class="grid-2">
        <div class="card">
            <h2>👤 Регистрация читателя</h2>
            <input id="rFirst" placeholder="Имя">
            <input id="rLast" placeholder="Фамилия">
            <input id="rEmail" placeholder="Email">
            <input id="rAge" type="number" placeholder="Возраст">
            <button onclick="addReader()">Зарегистрировать</button>
        </div>
        <div class="card">
            <h2>🔍 Поиск читателя по имени</h2>
            <input id="qName" placeholder="Введите имя или фамилию...">
            <button onclick="searchReaders()">Найти</button>
            <button style="background:#64748b" onclick="loadReaders()">Показать всех</button>
        </div>
    </div>

    <div class="card">
        <h2>Список читателей</h2>
        <table>
            <thead><tr><th>ID</th><th>Имя Фамилия</th><th>Email</th><th>Возраст</th><th>Статус</th><th>Действия</th></tr></thead>
            <tbody id="readersBody"></tbody>
        </table>
    </div>

    <div class="card" id="historyCard" style="display:none">
        <h2 id="historyTitle">История выдач читателя</h2>
        <table>
            <thead><tr><th>ID выдачи</th><th>ID книги</th><th>Дата выдачи</th><th>Срок</th><th>Статус</th></tr></thead>
            <tbody id="historyBody"></tbody>
        </table>
    </div>
</div>

<script src="/app.js"></script>
<script>
function notify(text, ok) {
    const m = document.getElementById('msg');
    m.textContent = text; m.className = ok ? 'ok' : 'err'; m.style.display = 'block';
    setTimeout(() => m.style.display = 'none', 4000);
}
function render(list) {
    document.getElementById('readersBody').innerHTML = (list || []).map(r => `
        <tr>
            <td>${r.id}</td><td><b>${r.firstName} ${r.lastName}</b></td><td>${r.email}</td><td>${r.age}</td>
            <td><span class="badge ${r.isActive ? 'badge-ok' : 'badge-err'}">${r.isActive ? 'Активен' : 'Неактивен'}</span></td>
            <td>
                <button class="btn-sm" onclick="showHistory(${r.id}, '${r.firstName} ${r.lastName}')">История</button>
                <button class="btn-sm btn-red" onclick="delReader(${r.id})">Удалить</button>
            </td>
        </tr>
    `).join('');
}
async function loadReaders() {
    const res = await apiFetch('/api/readers');
    if (!res.isSuccess) { notify(res.errorMessage, false); return; }
    render(res.result);
}
async function searchReaders() {
    const res = await apiFetch('/api/readers/search?name=' + encodeURIComponent(qName.value));
    if (!res.isSuccess) { notify(res.errorMessage, false); return; }
    render(res.result);
}
async function addReader() {
    const res = await apiFetch('/api/readers', {
        method: 'POST',
        body: JSON.stringify({ firstName: rFirst.value, lastName: rLast.value, email: rEmail.value, age: +rAge.value, isActive: true })
    });
    notify(res.isSuccess ? 'Читатель добавлен!' : res.errorMessage, res.isSuccess);
    if (res.isSuccess) loadReaders();
}
async function delReader(id) {
    const res = await apiFetch('/api/readers/' + id, { method: 'DELETE' });
    notify(res.isSuccess ? 'Читатель удалён' : res.errorMessage, res.isSuccess);
    loadReaders();
}
async function showHistory(id, name) {
    const res = await apiFetch(`/api/readers/${id}/loans`);
    if (!res.isSuccess) { notify(res.errorMessage, false); return; }
    document.getElementById('historyCard').style.display = 'block';
    document.getElementById('historyTitle').textContent = `История выдач: ${name} (ID: ${id})`;
    document.getElementById('historyBody').innerHTML = (res.result || []).length
        ? res.result.map(l => `<tr><td>${l.id}</td><td>${l.bookId}</td><td>${new Date(l.borrowedAt).toLocaleDateString()}</td><td>${new Date(l.dueDate).toLocaleDateString()}</td><td>${l.isReturned ? '✅ Возвращена' : '⏳ На руках'}</td></tr>`).join('')
        : '<tr><td colspan="5">У читателя пока нет выдач</td></tr>';
}
loadReaders();
</script>
</body>
</html>
